name: Auto Like

on:
  schedule:
    # UTC 04:00 = 台灣時間中午 12:00
    - cron: '0 4 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  auto-like:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore login state
        run: echo "${{ secrets.STATE_JSON_B64 }}" | base64 -d | gunzip > state.json

      - name: Run auto-like
        env:
          FB_TARGET_URLS: ${{ secrets.FB_TARGET_URLS }}
          FB_TARGET_URLS_NEW_ADD: ${{ secrets.FB_TARGET_URLS_NEW_ADD }}
          YT_TARGET_URLS: ${{ secrets.YT_TARGET_URLS }}
          YT_TARGET_URLS_NEW_ADD: ${{ secrets.YT_TARGET_URLS_NEW_ADD }}
          IG_TARGET_URLS: ${{ secrets.IG_TARGET_URLS }}
          IG_TARGET_URLS_NEW_ADD: ${{ secrets.IG_TARGET_URLS_NEW_ADD }}
          THREADS_TARGET_URLS: ${{ secrets.THREADS_TARGET_URLS }}
          THREADS_TARGET_URLS_NEW_ADD: ${{ secrets.THREADS_TARGET_URLS_NEW_ADD }}
          HEADLESS: 'true'
          DELAY_MS: '2000'
        run: pnpm start
