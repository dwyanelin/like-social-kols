name: Auto Like

on:
  schedule:
    # 每天 UTC 04:00（台灣中午 12:00）。搭配下方隨機延遲，避免每天同一秒觸發的機械節奏。
    - cron: '0 4 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  auto-like:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # 隨機延遲 0~20 分鐘再開跑，讓每次觸發時間不固定，降低機械節奏特徵（手動觸發時跳過）。
      - name: Random start delay
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1200))

      # Meta 三平台（FB / IG / Threads）因雲端機房 IP 必遭 Meta 風控攔截，已改由本機 macOS launchd 排程執行；
      # GitHub Actions 僅執行官方 OAuth API 模式的 YouTube 自動按讚。
      - name: Run auto-like (YouTube API)
        env:
          SKIP_META: 'true'
          YT_TARGET_URLS: ${{ secrets.YT_TARGET_URLS }}
          YT_TARGET_URLS_NEW_ADD: ${{ secrets.YT_TARGET_URLS_NEW_ADD }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
          TZ: 'Asia/Taipei'
        run: pnpm start
